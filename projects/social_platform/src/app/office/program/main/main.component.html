<!-- @format -->

<section class="programs-page">
  <header class="programs-page__header">
    <div>
      <h1 class="programs-page__subtitle">
        Выберите чемпионат для участия или создайте свой собственный.
      </h1>
    </div>
  </header>

  <form class="programs-page__search" [formGroup]="searchForm">
    <app-search
      formControlName="search"
      placeholder="Найти чемпионат"
      [openable]="false"
    ></app-search>
  </form>

  <nav class="programs-page__tabs" aria-label="Разделы чемпионатов">
    <a
      class="programs-page__tab"
      routerLink="/office/program/all"
      [class.programs-page__tab--active]="activeTab === 'all'"
    >
      Все чемпионаты
    </a>
    <a
      class="programs-page__tab"
      routerLink="/office/program/my"
      [class.programs-page__tab--active]="activeTab === 'my'"
    >
      Мои чемпионаты
    </a>
  </nav>

  @if (activeTab === "my") {
  <app-my-programs [programs]="searchedPrograms"></app-my-programs>
  } @else {
  <app-all-programs
    [programs]="searchedPrograms"
    [verifiedOnly]="verifiedOnly()"
    [registrationOpenOnly]="registrationOpenOnly()"
    [registrationSort]="registrationSort()"
    [loading]="isLoadingPrograms()"
    [hasLoaded]="hasLoadedPrograms()"
    (verifiedOnlyChange)="onVerifiedOnlyChange($event)"
    (registrationOpenOnlyChange)="onRegistrationOpenOnlyChange($event)"
    (registrationSortChange)="onRegistrationSortChange($event)"
  ></app-all-programs>
  }
</section>
